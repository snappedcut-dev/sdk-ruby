AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false

# Double quotes throughout, which is the prevailing modern convention and what
# this codebase uses consistently. Rubocop's default is single; this is a style
# choice, not a defect, so configure it rather than rewrite every string.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# The client is one cohesive object over five endpoints. Splitting it to satisfy
# a line count would make it harder to read, not easier.
Metrics:
  Enabled: false

Style/Documentation:
  Enabled: true

# Test names carry HTTP statuses -- test_a_402_is_rescuable reads better than
# any spelling this cop would accept.
Naming/VariableNumber:
  Exclude:
    - "test/**/*"

# `raise Error.new(msg, status, retry_after_ms:)` is required: the exception
# takes positional *and* keyword arguments, which `raise Error, msg` cannot pass.
Style/RaiseArgs:
  Enabled: false
